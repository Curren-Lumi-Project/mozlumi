name: Mozlumi Windows build (manual)

# Mozlumi 専用の Windows（x64）ビルド。手動でだけ動かす（push では動かない）。
#
# - 手動で動かすには、このファイルが既定のブランチ（main）にある必要がある。
#   ビルドするブランチ・タグ・コミットは、実行するときに「ref」で選ぶ。
# - できるもの：Mozlumi_v<版>_build<N>_windows_x64.msi と、その .sha256。
#   名前と .sha256 の形は、Windows のアップデート機能（mozlumi_update.ps1）が
#   リリースから探す形に合わせてある。
# - 道具：x64 の LLVM は update_deps.py の 20.1.1。本家 Mozkey は、Clang 20.1.1
#   のソースを Visual Studio 2022（windows-2022）でビルドしている（e7082626）。
#   ここも同じにする。LLVM を 22 系に上げたら、windows-2025 への切り替えを考えること。
#
# 長いビルドを無駄にしないための仕組み:
# - MSI を確かめて名前を付ける処理は .github/scripts/mozlumi_check_msi.ps1 に
#   ある。変えたら、先に Windows マシンで手元の MSI に対して動かして確かめる。
#   このスクリプトは「ref」ではなく、このワークフローと同じコミット（main）から使う。
# - MSI ができたあとの手順で失敗したら、MSI が「unchecked-Mozlumi64-msi」として
#   残る。直してから「reuse_msi_run」にその実行の番号（実行ページの URL の
#   /actions/runs/ のあとの数字）を入れて動かすと、ビルドせずに確認からやり直せる。
#   「ref」は前回と同じものを入れる（ビルド元のコミットが違うと止まる）。
# - Qt のビルド結果はキャッシュに残し、build_qt.py と update_deps.py が
#   変わらない限り使い回す。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ビルドするブランチ・タグ・コミット'
        type: string
        required: true
        default: main
      reuse_msi_run:
        description: '前の実行の MSI を使い回す（その実行の番号。空ならビルドする）'
        type: string
        required: false
        default: ''
      run_tests:
        description: 'テストも動かす（bazelisk test ... -c dbg --build_tests_only）'
        type: boolean
        default: false

permissions:
  contents: read
  # To download the MSI of an earlier run (reuse_msi_run).
  actions: read

concurrency:
  group: mozlumi-windows-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build_x64:
    name: Build Mozlumi64.msi (x64)
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: false
          persist-credentials: false

      # The CI scripts come from this workflow's own commit, not from "ref".
      - name: Checkout the CI scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: _mozlumi_ci
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Set up Python
        if: ${{ inputs.reuse_msi_run == '' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Read version and build number
        id: version
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $text = Get-Content -LiteralPath 'src/version.bzl' -Raw
          function Get-Field([string]$Name) {
            $m = [regex]::Match($text, "(?m)^$Name\s*=\s*(\d+)\s*$")
            if (-not $m.Success) { throw "$Name was not found in src/version.bzl" }
            return $m.Groups[1].Value
          }
          $version = '{0}.{1}.{2}' -f (Get-Field 'MOZKEY_RELEASE_VERSION_MAJOR'),
              (Get-Field 'MOZKEY_RELEASE_VERSION_MINOR'),
              (Get-Field 'MOZKEY_RELEASE_VERSION_PATCH')
          $build = Get-Field 'MOZLUMI_BUILD'
          $name = "Mozlumi_v${version}_build${build}_windows_x64"
          $commit = (git rev-parse HEAD).Trim()
          Write-Host "Source:  $env:SOURCE_REF ($commit)"
          Write-Host "Version: $version Build $build"
          "version=$version" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "build=$build" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$name" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit=$commit" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check the updater script (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'src\win32\updater\mozlumi_update.ps1'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            Write-Host "mozlumi_update.ps1 is not in this source. Skipped."
            exit 0
          }
          $bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "mozlumi_update.ps1 does not start with a UTF-8 BOM."
          }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            foreach ($e in $errors) { Write-Host ("line {0}: {1}" -f $e.Extent.StartLineNumber, $e.Message) }
            throw "mozlumi_update.ps1 has $($errors.Count) parse error(s)."
          }
          Write-Host ("mozlumi_update.ps1: BOM ok, 0 parse errors (PowerShell {0})" -f $PSVersionTable.PSVersion)

      - name: Prepare daily dictionary
        if: ${{ inputs.reuse_msi_run == '' }}
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\dictionary\prepare_daily_dictionary.ps1

      - name: Try to restore update_deps cache
        if: ${{ inputs.reuse_msi_run == '' }}
        uses: actions/cache@v5
        with:
          path: src/third_party_cache
          key: mozlumi-update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        if: ${{ inputs.reuse_msi_run == '' }}
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Check Clang and use Visual Studio 2022
        if: ${{ inputs.reuse_msi_run == '' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $clang = '.\src\third_party\llvm\bin\clang-cl.exe'
          if (-not (Test-Path -LiteralPath $clang -PathType Leaf)) {
            throw 'clang-cl.exe was not found in src\third_party\llvm\bin.'
          }
          $clangVersion = & $clang --version
          if ($LASTEXITCODE -ne 0 -or (($clangVersion -join ' ') -notmatch 'clang version 20\.')) {
            throw "This workflow expects Clang 20 with Visual Studio 2022, got: $($clangVersion -join ' '). If LLVM was updated, switch the runner to windows-2025."
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw 'vswhere.exe was not found.'
          }
          $install = @(& $vswhere -latest -products '*' -version '[17.0,18.0)' -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $install.Count -ne 1 -or [string]::IsNullOrWhiteSpace($install[0])) {
            throw 'Visual Studio 2022 was not found uniquely.'
          }
          $vc = Join-Path $install[0].Trim() 'VC'
          if (-not (Test-Path -LiteralPath $vc -PathType Container)) {
            throw "Visual Studio 2022 VC directory is missing: $vc"
          }
          "BAZEL_VC=$vc" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Clang:    $($clangVersion[0])"
          Write-Host "BAZEL_VC: $vc"

      # Qt (about 19 minutes) is reused while build_qt.py and update_deps.py
      # (which pins the Qt source) stay the same.
      - name: Restore the built Qt
        id: qt_cache
        if: ${{ inputs.reuse_msi_run == '' }}
        uses: actions/cache/restore@v5
        with:
          path: src/third_party/qt
          key: mozlumi-qt-${{ runner.os }}-${{ runner.arch }}-vs2022-release-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py') }}

      - name: Build Qt
        if: ${{ inputs.reuse_msi_run == '' && steps.qt_cache.outputs.cache-hit != 'true' }}
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      # Saved right away, so that it is kept even if a later step fails.
      - name: Save the built Qt
        if: ${{ inputs.reuse_msi_run == '' && steps.qt_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: src/third_party/qt
          key: ${{ steps.qt_cache.outputs.cache-primary-key }}

      # This is needed only for GitHub Actions where free disk space is quite limited.
      # Qt src is not there when the built Qt came from the cache.
      - name: Delete Qt src to save disk space
        if: ${{ inputs.reuse_msi_run == '' }}
        shell: cmd
        working-directory: .\src
        run: |
          if exist third_party\qt_src rmdir third_party\qt_src /s /q

      - name: Build Mozlumi64.msi
        if: ${{ inputs.reuse_msi_run == '' }}
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build --config release_build package

      # So that a long build is not lost when a later step fails. source.txt
      # records what it was built from, for reuse_msi_run.
      - name: Keep a copy of the built MSI
        id: keep
        if: ${{ inputs.reuse_msi_run == '' }}
        shell: pwsh
        env:
          MOZLUMI_VERSION: ${{ steps.version.outputs.version }}
          MOZLUMI_BUILD: ${{ steps.version.outputs.build }}
          MOZLUMI_COMMIT: ${{ steps.version.outputs.commit }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = [string](Join-Path $env:RUNNER_TEMP 'mozlumi-raw')
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -LiteralPath 'src\bazel-bin\win32\installer\Mozlumi64.msi' -Destination $dir
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $text = "ref=$env:SOURCE_REF`ncommit=$env:MOZLUMI_COMMIT`nversion=$env:MOZLUMI_VERSION`nbuild=$env:MOZLUMI_BUILD`n"
          [IO.File]::WriteAllText([string](Join-Path $dir 'source.txt'), $text, $utf8)

      - name: Download the MSI of the earlier run
        if: ${{ inputs.reuse_msi_run != '' }}
        uses: actions/download-artifact@v7
        with:
          name: unchecked-Mozlumi64-msi
          path: ${{ runner.temp }}/mozlumi-raw
          run-id: ${{ inputs.reuse_msi_run }}
          github-token: ${{ github.token }}

      - name: Check that the earlier MSI was built from this source
        if: ${{ inputs.reuse_msi_run != '' }}
        shell: pwsh
        env:
          MOZLUMI_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $env:RUNNER_TEMP 'mozlumi-raw\source.txt'
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
            Write-Host '::warning::The earlier run has no source.txt, so its source commit was not checked. The version check still runs.'
            exit 0
          }
          $built = ''
          foreach ($line in Get-Content -LiteralPath $file) {
            if ($line -match '^commit=([0-9a-f]{40})$') { $built = $Matches[1] }
          }
          Get-Content -LiteralPath $file | ForEach-Object { Write-Host $_ }
          if ($built -ne $env:MOZLUMI_COMMIT) {
            throw "The earlier MSI was built from $built, but ref is now at $env:MOZLUMI_COMMIT. Put that commit in ref."
          }

      - name: Check the MSI and give it the release name
        shell: powershell
        env:
          MOZLUMI_VERSION: ${{ steps.version.outputs.version }}
          MOZLUMI_BUILD: ${{ steps.version.outputs.build }}
          MOZLUMI_COMMIT: ${{ steps.version.outputs.commit }}
          SOURCE_REF: ${{ inputs.ref }}
          REUSE_MSI_RUN: ${{ inputs.reuse_msi_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE '_mozlumi_ci\.github\scripts\mozlumi_check_msi.ps1'
          $source = "``$env:SOURCE_REF`` (``$env:MOZLUMI_COMMIT``)"
          if ($env:REUSE_MSI_RUN) { $source += ", MSI of run $env:REUSE_MSI_RUN" }
          & $script `
              -MsiPath ([string](Join-Path $env:RUNNER_TEMP 'mozlumi-raw\Mozlumi64.msi')) `
              -Version $env:MOZLUMI_VERSION `
              -Build $env:MOZLUMI_BUILD `
              -OutDir ([string](Join-Path $env:RUNNER_TEMP 'mozlumi-msi')) `
              -Source $source `
              -SummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload the MSI and its .sha256
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.version.outputs.name }}
          path: ${{ runner.temp }}/mozlumi-msi/
          if-no-files-found: error

      - name: Upload the unchecked MSI (only when a later step failed)
        if: ${{ failure() && inputs.reuse_msi_run == '' && steps.keep.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: unchecked-Mozlumi64-msi
          path: ${{ runner.temp }}/mozlumi-raw/
          if-no-files-found: warn

  test_x64:
    name: Tests (x64, dbg)
    if: ${{ inputs.run_tests }}
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare daily dictionary
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\dictionary\prepare_daily_dictionary.ps1

      - name: Try to restore update_deps cache
        uses: actions/cache@v5
        with:
          path: src/third_party_cache
          key: mozlumi-update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/update_deps.py

      - name: Use Visual Studio 2022
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = @(& $vswhere -latest -products '*' -version '[17.0,18.0)' -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $install.Count -ne 1 -or [string]::IsNullOrWhiteSpace($install[0])) {
            throw 'Visual Studio 2022 was not found uniquely.'
          }
          $vc = Join-Path $install[0].Trim() 'VC'
          "BAZEL_VC=$vc" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BAZEL_VC: $vc"

      - name: Run tests
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk test ... -c dbg --build_tests_only
